<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Offline - SkillHub</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#1c2536;text-align:center}
  .card{background:#fff;padding:2.5rem;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);max-width:380px}
  h1{font-size:1.4rem;margin-bottom:.5rem}
  p{color:#5c667a}
</style>

  <div class="card">
    <h1>You're offline</h1>

  </div>
